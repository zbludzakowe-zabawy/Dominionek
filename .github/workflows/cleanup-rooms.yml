name: Sprzątanie pokoi gry online

# Raz w tygodniu usuwa z bazy Firebase stare pokoje (14 dni bez gry, pokoje po rewanżu po 2 dniach).
# Klucz konta usługi Firebase: sekret repozytorium FIREBASE_SERVICE_ACCOUNT (docs/gra-online.md).
on:
  schedule:
    - cron: '37 3 * * 1' # poniedziałek, 3:37 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Próba – tylko wypisz, co byłoby usunięte'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Usuń stare pokoje
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cleanup-rooms.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
